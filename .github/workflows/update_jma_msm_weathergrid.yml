name: Update JMA MSM WeatherGrid
# probe-2: verify r2_sync --files-from --from-disk actually uploads

on:
  schedule:
    # JMA MSM initializes every 3 hours. JMBSC distribution is normally
    # initial time + ~2h30m; Open-Meteo then ingests the run. Refresh at
    # +3h10m so the latest cycle is normally available across API replicas.
    - cron: '10 */3 * * *'
  push:
    branches:
      - main
    paths:
      - "jma_msm_cloud_poc.py"
      - "jma_msm_aws_om.py"
      - "jma_msm_weathergrid_browser_bundle.py"
      - ".github/workflows/update_jma_msm_weathergrid.yml"
  workflow_dispatch:
    inputs:
      forecast_hours:
        description: "Number of hourly JMA MSM valid times to publish"
        required: false
        default: "40"

concurrency:
  group: chaselights-jma-msm-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-jma-msm:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: chaselights-data
      R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
    timeout-minutes: 30
    steps:
      - name: Mark job start
        # Every producer writes into weathergrid/ during this job; the R2
        # publisher uploads exactly those files (checkout mtimes are useless as
        # a discriminator — a fresh clone touches everything).
        run: touch /tmp/job_start
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # CL-PAGES-08: this repo no longer carries weathergrid/ in git — the bucket
      # is the source of truth. Producers that rebuild weathergrid/index.json
      # hash the files on disk, and the calibration job reads the previous CWA
      # bundle, so pull the tree down before anything writes to it. R2 egress is
      # free; the cost is ~1 min per run.
      - name: Hydrate weathergrid from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          python -m pip install --quiet 'boto3>=1.34'
          python ops/pages/r2_pull.py --prefix weathergrid/ --dest . --workers 32
          # The hydration writes newer than /tmp/job_start; backdate it so the
          # publish step uploads only what this run actually produced.
          find weathergrid -type f -exec touch -d '2000-01-01T00:00:00Z' {} +
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install JMA WeatherGrid dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy "omfiles>=1.2,<2" fsspec s3fs

      - name: Fetch JMA MSM 5 km cloud WeatherGrid
        id: jma_msm
        continue-on-error: true
        env:
          JMA_FORECAST_HOURS: ${{ inputs.forecast_hours || '40' }}
        run: |
          python jma_msm_cloud_poc.py \
            --region tw \
            --forecast-hours "$JMA_FORECAST_HOURS" \
            --output-dir jma_msm_tw_output
          python jma_msm_cloud_poc.py \
            --region jp \
            --forecast-hours "$JMA_FORECAST_HOURS" \
            --output-dir jma_msm_jp_output

      - name: Build JMA MSM browser bundle and QC
        if: steps.jma_msm.outcome == 'success'
        run: |
          python jma_msm_weathergrid_browser_bundle.py \
            --region tw --input-dir jma_msm_tw_output
          python jma_msm_weathergrid_browser_bundle.py \
            --region jp --input-dir jma_msm_jp_output

      - name: Validate JMA MSM publish payload
        id: validate_jma_msm
        if: steps.jma_msm.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # CL-CI-06: JMA MSM refreshes every 3 h; a completed run is never
          # legitimately older than 15 h. A stale bundle must fail this
          # validation (and block the publish) instead of silently going out.
          JMA_MSM_MAX_CYCLE_AGE_HOURS = 15
          now = datetime.now(timezone.utc)

          def assert_fresh(bundle, label):
              cycle_time = bundle["cycle"]["cycle_time_utc"]
              cycle = datetime.fromisoformat(
                  cycle_time.replace("Z", "+00:00")
              ).astimezone(timezone.utc)
              age = now - cycle
              assert age <= timedelta(hours=JMA_MSM_MAX_CYCLE_AGE_HOURS), (
                  f"{label} JMA MSM bundle cycle {cycle_time} is "
                  f"{age.total_seconds() / 3600:.1f}h old (limit "
                  f"{JMA_MSM_MAX_CYCLE_AGE_HOURS}h); refusing to publish "
                  "a stale cycle"
              )
              return cycle_time

          root = Path("jma_msm_tw_output")
          browser = json.loads(
              (root / "jma_msm_tw_cloud_browser.json").read_text()
          )
          qc = json.loads(
              (root / "jma_msm_tw_cloud_qc.json").read_text()
          )

          assert browser.get("model") == "JMA_MSM", browser.get("model")
          assert browser.get("frames"), "JMA MSM bundle has no frames"
          assert qc.get("frame_count") == len(browser["frames"])
          provenance = browser.get("provenance", {})
          assert provenance.get("native_resolution_km") == 5.0, provenance
          assert provenance.get("native_time_interval_hours") == 1, provenance
          assert provenance.get("update_interval_hours") == 3, provenance
          assert provenance.get("production_transport") == "open_meteo_aws_open_data_om", provenance
          assert (
              provenance.get("forecast_hour_semantics")
              == "hours_from_model_cycle"
          ), provenance
          assert provenance.get("cycle_timestamp_available") is True, provenance
          tw_cycle_time = assert_fresh(browser, "tw")
          assert browser.get("cycle", {}).get("cycle_time_utc"), browser.get("cycle")
          assert browser.get("bbox") == {
              "leftlon": 120.0625,
              "rightlon": 124.5,
              "bottomlat": 22.45,
              "toplat": 27.0,
          }, browser.get("bbox")
          for field in (
              "total_cloud_percent",
              "low_cloud_percent",
              "mid_cloud_percent",
              "high_cloud_percent",
          ):
              assert field in browser.get("fields", {}), field
              assert browser["fields"][field].get("vertical_definition"), field

          print(json.dumps({
              "frames": len(browser["frames"]),
              "cycle_time_utc": tw_cycle_time,
              "grid": [
                  browser["grid"]["rows"],
                  browser["grid"]["cols"],
              ],
              "bbox": browser["bbox"],
              "fields": list(browser["fields"]),
              "forecast_hour_semantics": provenance.get(
                  "forecast_hour_semantics"
              ),
          }, indent=2))

          # CL-WG-05: the jp region bundle must fully cover the jp bbox.
          # (CL-CI-03: this jp check previously sat outside the <<'PY'
          # heredoc; bash then parsed the Python code and failed with
          # "syntax error near unexpected token '('". Kept inside so both
          # region validations run in Python.)
          jp = json.loads(
              Path("jma_msm_jp_output/jma_msm_jp_cloud_browser.json").read_text()
          )
          jp_qc = json.loads(
              Path("jma_msm_jp_output/jma_msm_jp_cloud_qc.json").read_text()
          )
          assert jp.get("model") == "JMA_MSM", jp.get("model")
          assert jp_qc.get("frame_count") == len(jp["frames"])
          jp_cycle_time = assert_fresh(jp, "jp")
          jp_bbox = jp.get("bbox") or {}
          jp_latitudes = jp.get("grid", {}).get("latitudes") or []
          jp_longitudes = jp.get("grid", {}).get("longitudes") or []
          assert (
              min(jp_latitudes) <= 24.0 and max(jp_latitudes) >= 46.0
              and min(jp_longitudes) <= 122.0 and max(jp_longitudes) >= 146.0
          ), f"jma_msm_jp bundle does not cover the jp region bbox: {jp_bbox}"

          print(json.dumps({
              "jp_frames": len(jp["frames"]),
              "jp_cycle_time_utc": jp_cycle_time,
              "jp_bbox": jp_bbox,
          }, indent=2))
          PY

      - name: Publish current JMA MSM snapshot state
        # CL-CI-06: a failed freshness/schema validation must block the
        # publish. On fetch failure (validate skipped) this still runs so
        # stale browser files are removed and the failure surfaces.
        if: always() && !cancelled() && steps.validate_jma_msm.outcome != 'failure'
        run: |
          mkdir -p weathergrid

          if [[ -f jma_msm_tw_output/jma_msm_tw_cloud_browser.json ]]; then
            cp jma_msm_tw_output/jma_msm_tw_cloud_browser.json weathergrid/jma_msm_tw_cloud_browser.json
            cp jma_msm_tw_output/jma_msm_tw_cloud_qc.json weathergrid/jma_msm_tw_cloud_qc.json
          else
            # Manual JMA selection must never silently serve an old run after
            # the current provider refresh has failed.
            rm -f weathergrid/jma_msm_tw_cloud_browser.json weathergrid/jma_msm_tw_cloud_qc.json
          fi
          if [[ -f jma_msm_jp_output/jma_msm_jp_cloud_browser.json ]]; then
            cp jma_msm_jp_output/jma_msm_jp_cloud_browser.json weathergrid/jma_msm_jp_cloud_browser.json
            cp jma_msm_jp_output/jma_msm_jp_cloud_qc.json weathergrid/jma_msm_jp_cloud_qc.json
          else
            rm -f weathergrid/jma_msm_jp_cloud_browser.json weathergrid/jma_msm_jp_cloud_qc.json
          fi

          # Rebuild the cache index so it always describes the files
          # present in this exact commit (the browser cache layer keys
          # immutable ?v=<sha12> fetches off these hashes).
          python -m unittest test_weathergrid_index_build
          python weathergrid_index_build.py weathergrid
          python -m pip install --quiet 'boto3>=1.34'
          find weathergrid -type f -newer /tmp/job_start -print > /tmp/changed.txt || true
          echo "changed files: $(wc -l < /tmp/changed.txt)"
          if [ -s /tmp/changed.txt ]; then
            python ops/pages/r2_sync.py --apply --only weathergrid --from-disk \
              --files-from /tmp/changed.txt --workers 12
          else
            echo "nothing changed; R2 untouched"
          fi
      - name: Upload JMA validation artifact
        if: steps.jma_msm.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jma-msm-weathergrid
          path: |
            jma_msm_tw_output/jma_msm_tw_cloud_browser.json
            jma_msm_tw_output/jma_msm_tw_cloud_qc.json
            jma_msm_jp_output/jma_msm_jp_cloud_browser.json
            jma_msm_jp_output/jma_msm_jp_cloud_qc.json
          if-no-files-found: error
          retention-days: 3

      - name: Fail if JMA refresh failed
        if: steps.jma_msm.outcome != 'success'
        run: |
          echo "JMA MSM refresh failed; stale browser files were removed."
          exit 1
