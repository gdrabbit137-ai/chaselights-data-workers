name: Update WeatherGrid V2 CWA Derived Tiles

on:
  workflow_run:
    workflows: ["Update Live WeatherGrid Preview"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: chaselights-weathergrid-v2-native-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-v2-cwa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: chaselights-data
      R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
    timeout-minutes: 20
    steps:
      - name: Mark job start
        # Every producer writes into weathergrid/ during this job; the R2
        # publisher uploads exactly those files (checkout mtimes are useless as
        # a discriminator — a fresh clone touches everything).
        run: touch /tmp/job_start
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # CL-PAGES-08: this repo no longer carries weathergrid/ in git — the bucket
      # is the source of truth. Producers that rebuild weathergrid/index.json
      # hash the files on disk, and the calibration job reads the previous CWA
      # bundle, so pull the tree down before anything writes to it. R2 egress is
      # free; the cost is ~1 min per run.
      - name: Hydrate weathergrid from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          python -m pip install --quiet 'boto3>=1.34'
          python ops/pages/r2_pull.py --prefix weathergrid/ --dest . --workers 32
          # The hydration writes newer than /tmp/job_start; backdate it so the
          # publish step uploads only what this run actually produced.
          find weathergrid -type f -exec touch -d '2000-01-01T00:00:00Z' {} +
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run CWA V2 publisher unit tests
        run: |
          python -m unittest -v test_weathergrid_v2_cwa_publish.py

      - name: Require current CWA compact bundle
        run: |
          test -s weathergrid/cwa_wrf3_tw_weather_browser.json

      - name: Publish CWA derived working set
        run: |
          rm -rf weathergrid/v2/cwa/current
          python weathergrid_v2_cwa_publish.py \
            --input weathergrid/cwa_wrf3_tw_weather_browser.json \
            --output-root weathergrid/v2 \
            | tee /tmp/weathergrid-v2-cwa-summary.json

      - name: Validate CWA derived publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("weathergrid/v2")
          index = json.loads((root / "index.json").read_text())
          run = index["provider_runs"]["cwa"]
          required = {
              "cwa_cloud_potential_low",
              "cwa_cloud_potential_mid",
              "cwa_cloud_potential_high",
              "cwa_lcl_height",
              "cwa_fog_potential",
          }
          assert required <= set(run["supported_fields"]), run["supported_fields"]
          assert run["published_regions"] == ["tw"]
          assert run["published_cell_ids"]
          token = run["nearest_valid_time_token"]
          for cell_id in run["published_cell_ids"]:
              path = root / "cwa/current" / token / f"{cell_id}.json"
              assert path.exists(), path
              tile = json.loads(path.read_text())
              assert tile["provider"] == "cwa"
              assert tile["regular_grid"] is True
              assert tile["native_grid"] is False
              assert required <= set(tile["values"]), tile["values"].keys()
          print(json.dumps({
              "nearest_valid_time_utc": run["nearest_valid_time_utc"],
              "cells": len(run["published_cell_ids"]),
              "fields": sorted(required),
          }, indent=2))
          PY

      - name: Publish V2 CWA snapshot to main
        run: |
          python -m pip install --quiet 'boto3>=1.34'
          find weathergrid -type f -newer /tmp/job_start -print > /tmp/changed.txt || true
          echo "changed files: $(wc -l < /tmp/changed.txt)"
          if [ -s /tmp/changed.txt ]; then
            python ops/pages/r2_sync.py --apply --only weathergrid --from-disk \
              --files-from /tmp/changed.txt --workers 12
          else
            echo "nothing changed; R2 untouched"
          fi
      - name: Upload CWA V2 publisher artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weathergrid-v2-cwa-derived
          path: |
            /tmp/weathergrid-v2-cwa-summary.json
            weathergrid/v2/index.json
            weathergrid/v2/cwa/current/manifest.json
          if-no-files-found: warn
          retention-days: 3
